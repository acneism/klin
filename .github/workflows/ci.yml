name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Полная сборка с Servo — раз в сутки (docs/spec.md, «CI»).
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Каждый коммит: форматирование, clippy и юнит-тесты без сборки движка.
  quick:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test

  # Полная сборка с Servo: раз в сутки и перед слиянием в main.
  full:
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      # Servo 0.6+ требует Clang 19 или новее.
      - name: Install LLVM and pkg-config
        run: choco install llvm pkgconfiglite -y --no-progress
      - run: clang --version
      - name: Cache GStreamer
        id: gstreamer-cache
        uses: actions/cache@v4
        with:
          path: C:\gst
          key: gstreamer-msvc-x86_64-1.22.8
      - name: Install GStreamer
        if: steps.gstreamer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/servo/servo-build-deps/releases/download/msvc-deps"
          foreach ($name in @("gstreamer-1.0-msvc-x86_64-1.22.8.msi", "gstreamer-1.0-devel-msvc-x86_64-1.22.8.msi")) {
            curl.exe -fL --retry 5 --retry-all-errors -o $name "$base/$name"
            if ($LASTEXITCODE -ne 0) { throw "download of $name failed" }
            $process = Start-Process msiexec.exe -ArgumentList "/a", $name, "/qn", "TARGETDIR=C:\gst" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$name failed with $($process.ExitCode)" }
          }
      - name: Use GStreamer
        shell: pwsh
        run: |
          $root = "C:\gst\gstreamer\1.0\msvc_x86_64\"
          if (-not (Test-Path "${root}lib\pkgconfig\gstreamer-1.0.pc")) { throw "GStreamer is not in $root" }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=${root}lib\pkgconfig" >> $env:GITHUB_ENV
          "${root}bin" >> $env:GITHUB_PATH
      - run: cargo clippy --workspace --all-targets
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Bundle GStreamer next to klin.exe
        shell: pwsh
        run: ./tools/copy-gstreamer.ps1 -Target target/debug
