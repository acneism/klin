name: Probe GStreamer packages

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $listing = (Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc/").Content
          [regex]::Matches($listing, 'href="([^"?/]+)"') | ForEach-Object { $_.Groups[1].Value } | Where-Object { $_ -match 'x86_64' } | ForEach-Object { Write-Host "1.24.13: $_" }
          $v = "1.28.8"
          $name = "gstreamer-1.0-msvc-x86_64-$v.exe"
          Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc/$name" -OutFile $name
          $p = Start-Process ".\$name" -ArgumentList "/?" -PassThru
          Start-Sleep 5
          if (-not $p.HasExited) { Stop-Process $p -Force }
          $p = Start-Process ".\$name" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TYPE=full", "/DIR=C:\gstreamer\1.0\msvc_x86_64", "/LOG=gst.log" -Wait -PassThru
          Write-Host "exit $($p.ExitCode)"
          Get-Content gst.log -Tail 20 -ErrorAction SilentlyContinue
          Get-ChildItem C:\gstreamer -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.FullName)" }
          Get-ChildItem C:\gstreamer -Recurse -Include pkg-config.exe,gstreamer-1.0.pc,gstcoreelements.dll -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "FOUND $($_.FullName)" }
          Get-ChildItem Env: | Where-Object { $_.Name -match 'GSTREAMER' } | ForEach-Object { Write-Host "ENV $($_.Name)=$($_.Value)" }
          [Environment]::GetEnvironmentVariables("Machine").Keys | Where-Object { $_ -match 'GSTREAMER' } | ForEach-Object { Write-Host "MACHINE ENV $_=$([Environment]::GetEnvironmentVariable($_, 'Machine'))" }
