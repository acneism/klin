[workspace]
resolver = "3"
members = ["crates/*"]
# Everything except the Servo-dependent crates builds in seconds.
# `cargo test` runs core logic tests without compiling the engine.
# The full build (`cargo build --workspace`) runs nightly in CI and before merging to main.
default-members = [
    "crates/shared",
    "crates/core",
    "crates/ui",
    "crates/internal-pages",
    "crates/profile",
    "crates/storage",
    "crates/sync",
    "crates/remote-settings",
    "crates/content-blocking",
    "crates/downloads",
    "crates/extensions",
    "crates/importer",
    "crates/platform-win",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# 1.89: File::try_lock (profile lock). servo 0.7.0 itself needs 1.88.
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/acneism/klin"
authors = ["Klin contributors"]

[workspace.dependencies]
# Servo is pinned exactly: updates are a separate monthly task (docs/spec.md, «Интеграция с Servo»).
servo = { version = "=0.7.0", default-features = true }

url = "2.5"
# Same major as servo 0.7.0, so SQLite is compiled once.
rusqlite = { version = "0.38", features = ["bundled"] }
thiserror = "2"
ammonia = "4.2.4"
psl = "2.1.248"
include_dir = "0.7.4"
serde_json = "1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"] }
log = "0.4"
winit = "0.30.13"
# egui 0.36 is built on glow 0.17 and winit 0.30, the same versions as servo 0.7.0.
# Not 0.37: epaint 0.37 rasterizes glyphs with vello_cpu 0.2 and never calls flush(),
# which panics once servo-canvas enables vello_cpu's `multithreading` feature.
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links"] }
egui_glow = { version = "=0.36.2", features = ["winit"] }
glow = "0.17"
euclid = "0.22"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

klin-shared = { path = "crates/shared" }
klin-core = { path = "crates/core" }
klin-ui = { path = "crates/ui" }
klin-engine = { path = "crates/engine" }
klin-internal-pages = { path = "crates/internal-pages" }
klin-profile = { path = "crates/profile" }
klin-storage = { path = "crates/storage" }
klin-sync = { path = "crates/sync" }
klin-remote-settings = { path = "crates/remote-settings" }
klin-content-blocking = { path = "crates/content-blocking" }
klin-downloads = { path = "crates/downloads" }
klin-extensions = { path = "crates/extensions" }
klin-importer = { path = "crates/importer" }
klin-platform-win = { path = "crates/platform-win" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
