[package]
name = "klin-app"
default-run = "klin"
description = "Klin — исполняемый файл браузера"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
klin-shared.workspace = true
klin-core.workspace = true
klin-engine.workspace = true
klin-ui.workspace = true
klin-profile.workspace = true
klin-storage.workspace = true
klin-downloads.workspace = true
klin-importer.workspace = true
klin-platform-win.workspace = true
winit.workspace = true
url.workspace = true
log.workspace = true
rustls.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_glow.workspace = true

# Системный диалог выбора файла (IFileOpenDialog), как в Firefox для Windows.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }

[lints]
workspace = true

[[bin]]
name = "klin"
path = "src/main.rs"
