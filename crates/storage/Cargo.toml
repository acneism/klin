[package]
name = "klin-storage"
description = "Хранилища профиля Klin: content-prefs, позже places, logins, sessionstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
klin-shared.workspace = true
rusqlite = { workspace = true, features = ["functions", "window", "limits", "unlock_notify", "fallible_uint"] }
# Зависимости перенесённого places (application-services).
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
serde_json = "1"
parking_lot = "0.12"
lazy_static = "1.4"
url = { workspace = true, features = ["serde"] }
percent-encoding = "2.1"
icu_casemap = "2"
bitflags = "1.2"
idna = "1.0.3"
memchr = "2.3"
thiserror.workspace = true
anyhow = "1.0"
rand = "0.8"
base64 = "0.21"
aes-gcm = "0.10.3"
# mozlz4 (sessionstore.jsonlz4): блок LZ4 без кадра, реализация на Rust.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
log.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[features]
# Инструменты отладки SQL из sql-support (application-services).
debug-tools = []
# Возможности перенесённого logins (application-services), по умолчанию выключены.
perform_additional_origin_fixups = []
ignore_form_action_origin_validation_errors = []
allow_empty_passwords = []
keydb = []
fixup_invalid_guids = []
